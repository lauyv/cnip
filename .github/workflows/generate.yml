name: Generate China IP Database

on:
  schedule:
    - cron: "0 0 * * *" # 北京时间每天 08:00
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-databases
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run generator
        run: go mod download && go run main.go

      - name: Compile sing-box rule-set
        run: |
          bash <(curl -fsSL https://sing-box.app/deb-install.sh)
          sing-box version
          sing-box rule-set compile dist/chnroutes.json
          rm dist/chnroutes.json

      - name: Publish rel branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C dist init --initial-branch=rel
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add .
          git -C dist commit -m "$(date -u +%Y%m%d%H%M)"
          git -C dist remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C dist push --force origin rel
